name: release-gates
on:
  pull_request:
  workflow_dispatch:
env:
  OB_REF: v0.10.2
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: boutique, config: scripts/kind-config.yaml}
      - uses: grafana/setup-k6-action@v1
      - name: Deploy app + chaos mesh (monitoring skipped in CI for speed)
        run: |
          kubectl create ns boutique
          curl -sSL https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/$OB_REF/release/kubernetes-manifests.yaml -o ob.yaml
          python3 scripts/strip_loadgen.py ob.yaml | kubectl -n boutique apply -f -
          kubectl -n boutique rollout status deploy --timeout=300s
          helm repo add chaos-mesh https://charts.chaos-mesh.org
          helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --create-namespace \
            --set chaosDaemon.runtime=containerd --set chaosDaemon.socketPath=/run/containerd/containerd.sock --wait
          kubectl -n boutique port-forward svc/frontend 8080:80 &
          sleep 5
      - name: Gate 1 (BLOCKS) perf smoke vs SLI thresholds
        run: PROFILE=smoke k6 run perf/load.js
      - name: Gate 2 (BLOCKS) chaos - productcatalog failure with HA mitigation applied
        run: |
          chaos/mitigation/apply.sh
          chaos/gate.sh chaos/exp1-productcatalog-failure.yaml 5
      - name: Gate 3 (BLOCKS) security blockers + failure scenarios
        run: security/run.sh
      - name: Gate 4 (WARNS) hardening findings
        continue-on-error: true
        run: cd security && python3 -m pytest tests -m warn -q
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: evidence, path: "perf/results\nchaos/results\nsecurity/results"}
