# FIX for S08/S09: default-deny ingress + least-privilege allow rules (derived from the call graph).
# Apply: kubectl apply -f security/fixes/networkpolicies.yaml ; rerun: pytest security/tests -k 's08 or s09'
# Requires a CNI that enforces NetworkPolicy (verify on your kind version; else install Calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: boutique}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-frontend-ingress, namespace: boutique}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
  - ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-cartservice, namespace: boutique}
spec:
  podSelector: {matchLabels: {app: cartservice}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: frontend}}
    - podSelector: {matchLabels: {app: checkoutservice}}
    ports: [{port: 7070}]
---
apiVersion: networking.k8s.io/v1
